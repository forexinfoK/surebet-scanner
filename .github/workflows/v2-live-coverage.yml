name: V2 live data coverage check
on:
  push:
    branches:
      - v2.0-development
    paths:
      - ".github/workflows/v2-live-coverage.yml"
      - "v2-test/openligadb-coverage.mjs"
  workflow_dispatch:
    inputs:
      season:
        description: "Season start year (e.g. 2026 for 2026/27)"
        required: false
        default: "2026"
  schedule:
    - cron: "23 5 * * 1"
permissions:
  contents: read
  actions: write
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.0-development
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check OpenLigaDB competition coverage
        env:
          SEASON: ${{ inputs.season || '2026' }}
        run: node v2-test/openligadb-coverage.mjs
      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: openligadb-coverage-${{ inputs.season || '2026' }}
          path: |
            openligadb-coverage.json
            openligadb-coverage.md
          if-no-files-found: error
