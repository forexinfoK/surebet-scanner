<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surebet 2.0 – Tennis Elo Tests</title><style>body{font:16px system-ui;max-width:850px;margin:28px auto;padding:0 16px;background:#101827;color:#eee}.item{padding:10px;margin:8px 0;border:1px solid #64748b;border-radius:8px}.ok{border-color:#16a34a}.fail{border-color:#dc2626}button{padding:12px 18px}</style></head><body><h1>Tennis Elo – technische Tests</h1><p>Synthetische Testdaten. Keine Aussage über Prognosegüte oder aktuelle Spielplandaten.</p><button id="run">Tests starten</button><h2 id="summary">Noch nicht ausgeführt</h2><div id="results"></div><script type="module">
import {calculateTennisElo,expectedScore} from "../v2/src/models/tennis-elo.js";
const hist=[];const players=["A","B","C","D","E","F"];const surfaces=["hard","clay","grass"];
for(let i=0;i<90;i++){hist.push({dateUtc:new Date(Date.UTC(2024,0,1+i*3,12)).toISOString(),status:"completed",tour:i%2?"WTA":"ATP",winnerId:players[i%6],loserId:players[(i+2)%6],surface:surfaces[i%3]})}
const checks=[];const test=(name,fn)=>{try{fn();checks.push({name,ok:true})}catch(e){checks.push({name,ok:false,error:e.message})}};const assert=(v,m)=>{if(!v)throw Error(m)};
document.getElementById("run").onclick=()=>{
 checks.length=0;
 test("Wahrscheinlichkeiten summieren auf 1",()=>{const p=calculateTennisElo(hist,{tour:"ATP",playerAId:"A",playerBId:"B",startUtc:"2025-01-01T12:00:00Z"}).probabilities;assert(Math.abs(p.player_a+p.player_b-1)<1e-12,"Summe falsch")});
 test("ATP und WTA sind strikt getrennt",()=>{const a=calculateTennisElo(hist,{tour:"ATP",playerAId:"A",playerBId:"B",startUtc:"2025-01-01T12:00:00Z"});const b=calculateTennisElo(hist,{tour:"WTA",playerAId:"A",playerBId:"B",startUtc:"2025-01-01T12:00:00Z"});assert(a.data_quality.historical_matches!==b.data_quality.historical_matches||a.ratings.overall_a!==b.ratings.overall_a,"Touren nicht getrennt")});
 test("Zukünftige Ergebnisse werden ausgeschlossen",()=>{const base=calculateTennisElo(hist,{tour:"ATP",playerAId:"A",playerBId:"B",startUtc:"2025-01-01T12:00:00Z"});const extended=calculateTennisElo([...hist,{dateUtc:"2025-02-01T12:00:00Z",status:"completed",tour:"ATP",winnerId:"A",loserId:"B",surface:"hard"}],{tour:"ATP",playerAId:"A",playerBId:"B",startUtc:"2025-01-01T12:00:00Z"});assert(base.ratings.overall_a===extended.ratings.overall_a&&base.data_quality.historical_matches===extended.data_quality.historical_matches,"Zukunftsspiel beeinflusst Rating")});
 test("Oberflächenrating nur bei ausreichender Stichprobe",()=>{const p=calculateTennisElo(hist,{tour:"ATP",playerAId:"A",playerBId:"B",startUtc:"2025-01-01T12:00:00Z",surface:"hard"},{minSurfaceMatches:999});assert(!p.data_quality.surface_component_used,"Oberflächenrating zu früh verwendet")});
 test("Ungültige Tour wird abgelehnt",()=>{let rejected=false;try{calculateTennisElo(hist,{tour:"ITF",playerAId:"A",playerBId:"B",startUtc:"2025-01-01T12:00:00Z"})}catch(e){rejected=true}assert(rejected,"Ungültige Tour angenommen")});
 test("Erwartungswert ist symmetrisch",()=>assert(Math.abs(expectedScore(1500,1500)-.5)<1e-12,"1500 gegen 1500 ist nicht 50 %"));
 const root=document.getElementById("results");root.replaceChildren();checks.forEach(c=>{const d=document.createElement("div");d.className="item "+(c.ok?"ok":"fail");d.textContent=(c.ok?"BESTANDEN: ":"FEHLER: ")+c.name+(c.error?" – "+c.error:"");root.append(d)});document.getElementById("summary").textContent=checks.filter(c=>c.ok).length+" / "+checks.length+" bestanden";
};
</script></body></html>
